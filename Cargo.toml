[workspace]
members = ["src-tauri", "simulator/src-tauri", "crates/bf-core", "crates/bf-sim"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
bf-core = { path = "crates/bf-core" }
bf-sim = { path = "crates/bf-sim" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
